<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <title>Liên hệ</title>
    <style>
        html {
            scroll-behavior: smooth;
        }

        body {
            background-color: #f5f5f5;
            font-family: Arial;
            margin: 0;
            font-size: 25px;
        }

        /* header */
        .header img {
            width: 100%;
            height: 350px;
        }

        /* menu */
        .menu {
            background: darkorange;
            padding: 12px;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 100000000000;
        }

        .menu a {
            color: white;
            margin: 0 15px;
            font-size: 18px;
            text-decoration: none;
            font-weight: bold;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 35px;
        }

        .menu a:hover {
            color: yellow;
        }

        /* danhmuc */
        .danhmuc {
            display: inline-block;
            position: relative;
        }

        /* diadiem */
        .diadiem {
            display: none;
            position: absolute;
            background: white;
            min-width: 185px;
            box-shadow: 6px 4px 12px gray;
            border-radius: 5px;
        }

        .diadiem a {
            display: block;
            padding: 10px;
            color: black;
            text-decoration: none;
        }

        .diadiem a:hover {
            background: #eee;
        }

        .danhmuc:hover .diadiem {
            display: block;
        }

        /* noidung */
        .noidung {
            width: 85%;
            margin: 30px auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px gray;
            line-height: 2;

        }

        h2 {
            color: #cc5500;
        }

        /* food */
        .food {
            background: white;
            border-radius: 10px;
            box-shadow: 0 2px 8px gray;
            transition: 0.5s;
        }

        .food:hover {
            transform: translateY(-6px);
            box-shadow: 0 6px 12px gray;
        }

        .food img {
            border-radius: 10px;
        }

        .food .thongtin {
            padding: 10px;
            text-align: center;
            font-size: 20px;
        }

        .food a {
            color: #cc5500;
            text-decoration: none;
            font-weight: bold;
        }

        .food p {
            margin: 5px 0;
            font-size: 14px;
        }

        /* footer */
        .footer {
            background: darkorange;
            color: white;
            text-align: center;
            padding: 15px;
        }

        .footer p {
            margin: 5px 0;
        }

        .tieude {
            font-size: 30px;
        }

        table {
            margin: 20px auto;
            width: "100%";
            cellspacing: "20"
        }

        td {
            width: "50%"
        }
    </style>
</head>
